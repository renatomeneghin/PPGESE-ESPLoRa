[env:heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
lib_deps =
    ; Dependências diretas usadas pelo código.
    ; As versões são fixadas para tornar o build reproduzível.
    jgromes/RadioLib@7.7.1
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit MPU6050@2.2.9
    ; Unified Sensor, BusIO, GFX e SSD1306 são resolvidas transitivamente
    ; pelas bibliotecas Adafruit acima.
    TinyML/ei-car-state-arduino-1.0.6-k-means-anomaly-detection.zip
build_flags =
    -DCORE_DEBUG_LEVEL=3
